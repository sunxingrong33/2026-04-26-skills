name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-agent.txt
      - run: python -m pytest -q
      - run: python -m phase0.sar.demo
      - uses: actions/upload-artifact@v4
        with:
          name: sar-evidence-python-${{ matrix.python-version }}
          path: artifacts/
  browser:
    # Optional: real-browser checks of the main page paths (offline fixtures).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q phase0/tests/test_browser.py
        env:
          SAR_REQUIRE_BROWSER: '1'
